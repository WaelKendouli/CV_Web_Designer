<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Designer</title>
    <link rel="stylesheet" href="Theme.css" />
    <script src="Logic.js" defer ></script>
  </head>
  <body>
    

    <main>
    <div class="flow">
        <h1 class="title">CV Designer | Made by Wael Kendouli</h1>
      <div class="Layout">
        <div class="ToolsPanel">
            <div class="Container">
               <p class="Title">Personal Information</p>
                <label >Full name :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your name ..."
            autocomplete="off"
          />
          <label >Position :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your position ..."
            autocomplete="off"
          />
           <label >Email :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your email ..."
            autocomplete="off"
          />
           <label >Phone :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your phone ..."
            autocomplete="off"
          />
           <label >LinkedIn :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your LinkedIn profile URL ..."
            autocomplete="off"
          />
           <label >Github :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your GitHub profile URL ..."
            autocomplete="off"
          />
           <label >Photo :</label>
          <input
            id="serial"
            type="file"
            placeholder="Type your photo URL ..."
            autocomplete="off"
          />
          </div>
            <div class="Container">
              <p class="Title">More Information</p>
<label >Description :</label>
          <textarea
            id="serial"
            placeholder="Type your description ..."
            autocomplete="off"
          ></textarea>
          <div class="Button_Container">
            <label >Skills :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your Skill ..."
            autocomplete="off"
          />
            <button >+ Add skill</button>
          </div>
            </div>

            <div class="Container">
              <p class="Title">Additional Informations</p>

          <div class="Button_Container">
            <label >Languages :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your languages ..."
            autocomplete="off"
          />
          <!-- HTML Structure -->
           <label for="ice-cream">Choose your level</label>
<div class="combo-wrapper">
  
  <input type="text" id="ice-cream" name="ice-cream" list="flavors" class="combo-input" placeholder="Select or type..." />
  <datalist id="flavors">
    <option value="Beginner"></option>
    <option value="Intermediate"></option>
    <option value="Advanced"></option>
  </datalist>
</div>
            <button >+ Add language</button>
          </div>
            </div>
        </div>
        <div class="Page"></div>
      </div>
    </main>
</div>
    
  </body>
</html>
