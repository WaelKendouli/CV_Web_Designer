<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Designer</title>
    <link rel="stylesheet" href="Theme.css" />
    <script src="Logic.js" defer ></script>
  </head>
  <body>
    

    <main>
    <div class="flow">
        <h1 class="title">CV Designer | Made by Wael Kendouli</h1>
      <div class="Layout">
        <div class="ToolsPanel">
            <div class="Container">
               <p class="Title">Personal Information</p>
                <label >Full name :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your name ..."
            autocomplete="off"
          />
          <label >Position :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your position ..."
            autocomplete="off"
          />
           <label >Email :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your email ..."
            autocomplete="off"
          />
           <label >Phone :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your phone ..."
            autocomplete="off"
          />
           <label >LinkedIn :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your LinkedIn profile URL ..."
            autocomplete="off"
          />
           <label >Github :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your GitHub profile URL ..."
            autocomplete="off"
          />
           <label >Photo :</label>
          <input
            id="serial"
            type="file"
            placeholder="Type your photo URL ..."
            autocomplete="off"
          />
          </div>
            <div class="Container">
              <p class="Title">More Information</p>
<label >Description :</label>
          <textarea
            id="serial"
            placeholder="Type your description ..."
            autocomplete="off"
          ></textarea>
          <div class="Button_Container">
            <label >Skills :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your Skill ..."
            autocomplete="off"
          />
            <button >+ Add skill</button>
          </div>
            </div>

            <div class="Container">
              <p class="Title">Experience</p><br/>
<label>Job Title :</label>
          <input
            id="serial"
            placeholder="Type your job title ..."
            autocomplete="off"
          />
          <label >Company :</label>
          <input
            id="serial"
            placeholder="Type your company name ..."
            autocomplete="off"
          />
          <label >Location :</label>
          <input
            id="serial"
            placeholder="Type your location ..."
            autocomplete="off"
          />
          <label >From :</label>
          <input
            id="serial"
            placeholder="Type your start date ..."
            autocomplete="off"
          />
          <label >To :</label>
          <input
            id="serial"
            placeholder="Type your end date ..."
            autocomplete="off"
          />
          <label >Details :</label>
          <input
            id="serial"
            placeholder="Type your job details ..."
            autocomplete="off"
          />
          <div class="Button_Container">
            <button >+ Add Detail</button>
          </div>
            </div>

            <div class="Container">
              <p class="Title">Education</p><br/>
<label>Degree :</label>
          <input
            id="serial"
            placeholder="Type your degree ..."
            autocomplete="off"
          />
          <label >University :</label>
          <input
            id="serial"
            placeholder="Type your university name ..."
            autocomplete="off"
          />
          <label >Location :</label>
          <input
            id="serial"
            placeholder="Type your location ..."
            autocomplete="off"
          />
          <label >From :</label>
          <input
            id="serial"
            placeholder="Type your start date ..."
            autocomplete="off"
          />
          <label >To :</label>
          <input
            id="serial"
            placeholder="Type your end date ..."
            autocomplete="off"
          />
          <label >Details :</label>
          <input
            id="serial"
            placeholder="Type your job details ..."
            autocomplete="off"
          />
          <div class="Button_Container">
            <button >+ Add Detail</button>
          </div>
            </div>

<div class="Container">
              <p class="Title">Certifications</p>
<label >Certification :</label>
          <textarea
            id="serial"
            placeholder="Type your certification ..."
            autocomplete="off"
          ></textarea>
         

            <label >Platform :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your Platform ..."
            autocomplete="off"
          />
           <label >Date :</label>
          <input
            id="serial"
            type="Date"
            placeholder="Type your Date ..."
            autocomplete="off"
          />
          <div class="Button_Container">
            <button >+ Add Certification</button>
          </div>
            </div>

            <div class="Container">
              <p class="Title">Additional Informations</p>

          <div class="Button_Container">
            <label >Languages :</label>
          <input
            id="serial"
            type="text"
            placeholder="Type your languages ..."
            autocomplete="off"
          />
          <!-- HTML Structure -->
           <label>Choose your level</label>
<select id="dropdown">
        <option value="Beginner">Beginner</option>
        <option value="Intermediate" selected>Intermediate</option>
        <option value="Advanced">Advanced</option>
        <option value="Fluent">Fluent</option>
        <option value="Native">Native</option>
    </select>
            <button >+ Add language</button>
          </div>
            </div>

            
        </div>
        <div class="Page">
          <div class="CV_Layout">
            <div class="CV_header">
              
            </div>
          </div>
        </div>
      </div>
    </main>
</div>
    
  </body>
</html>
